name: Build NoAds VIP IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          brew install ldid
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build WalliveUnlock tweak
        run: |
          cd WalliveUnlock
          make FINALPACKAGE=1 DEBUG=0
          DYLIB=$(find .theos -name 'WalliveUnlock.dylib' | head -1)
          echo "dylib: $DYLIB"
          if [ -z "$DYLIB" ]; then
            find .theos -type f | head -50
            exit 1
          fi
          echo "DYLIB=$PWD/$DYLIB" >> "$GITHUB_ENV"

      - name: Install lief
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install lief
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Package IPA
        run: python3 scripts/build_ipa.py "$DYLIB" Wallive-NoAds-VIP.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wallive-NoAds-VIP-ipa
          path: Wallive-NoAds-VIP.ipa
